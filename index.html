<!DOCTYPE html>
<html>
<head>
  <title>SmartPrint V1</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f1f5f9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 36px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.09);
    }

    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
    .brand-icon { font-size: 26px; }
    .brand-name { font-size: 20px; font-weight: 700; color: #1e293b; }

    /* Upload area */
    .upload-area {
      border: 2px dashed #cbd5e1;
      border-radius: 12px;
      padding: 32px 20px;
      text-align: center;
      cursor: pointer;
      background: #f8fafc;
      position: relative;
      transition: all 0.2s;
      margin-bottom: 20px;
    }

    .upload-area:hover { border-color: #3b82f6; background: #eff6ff; }
    .upload-area.has-file { border-color: #22c55e; background: #f0fdf4; }
    .upload-area.loading { border-color: #f59e0b; background: #fffbeb; }

    .upload-area input[type="file"] {
      position: absolute; inset: 0;
      opacity: 0; cursor: pointer;
      width: 100%; height: 100%;
    }

    .upload-icon { font-size: 36px; margin-bottom: 8px; }
    .upload-text { font-size: 14px; font-weight: 600; color: #475569; }
    .upload-hint { font-size: 12px; color: #94a3b8; margin-top: 4px; }

    #file-name {
      font-size: 13px; font-weight: 600;
      color: #16a34a; margin-top: 10px;
      display: none;
      word-break: break-all;
    }

    /* Print type toggle */
    .section-label { font-size: 12px; font-weight: 600; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }

    .type-toggle { display: flex; border: 1px solid #e2e8f0; border-radius: 10px; overflow: hidden; margin-bottom: 20px; }
    .type-toggle input[type="radio"] { display: none; }
    .type-toggle label {
      flex: 1; text-align: center;
      padding: 10px 8px;
      font-size: 13px; font-weight: 500;
      color: #64748b; cursor: pointer;
      background: #f8fafc;
      transition: all 0.15s;
      line-height: 1.4;
    }

    .type-toggle input[type="radio"]:checked + label { background: #1e293b; color: #fff; }

    /* Summary box */
    #summary {
      background: #f8fafc;
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 20px;
      display: none;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: #64748b;
      padding: 4px 0;
    }

    .summary-row span:last-child { font-weight: 600; color: #1e293b; }

    .summary-total {
      display: flex;
      justify-content: space-between;
      font-size: 15px;
      font-weight: 700;
      color: #1e293b;
      padding-top: 10px;
      margin-top: 6px;
      border-top: 1px solid #e2e8f0;
    }

    .summary-total span:last-child { color: #16a34a; }

    /* Upload button */
    .btn-upload {
      width: 100%; padding: 13px;
      background: #3b82f6; color: #fff;
      border: none; border-radius: 10px;
      font-size: 15px; font-weight: 600;
      cursor: pointer; transition: background 0.2s;
    }

    .btn-upload:hover:not(:disabled) { background: #2563eb; }
    .btn-upload:disabled { background: #cbd5e1; color: #94a3b8; cursor: not-allowed; }

    /* Status */
    #status {
      margin-top: 14px; padding: 12px 16px;
      border-radius: 8px; font-size: 14px;
      font-weight: 500; display: none;
    }

    #status.info    { display: block; background: #dbeafe; color: #1d4ed8; }
    #status.success { display: block; background: #dcfce7; color: #15803d; }
    #status.error   { display: block; background: #fee2e2; color: #b91c1c; }

    .footer-link { text-align: center; margin-top: 20px; font-size: 13px; color: #94a3b8; }
    .footer-link a { color: #3b82f6; text-decoration: none; font-weight: 500; }
    .footer-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>

<div class="card">
  <div class="brand">
    <div class="brand-icon">🖨️</div>
    <div class="brand-name">SmartPrint</div>
  </div>

  <div class="upload-area" id="uploadArea">
    <input type="file" id="fileInput" accept="application/pdf" onchange="onFileSelect()" />
    <div class="upload-icon" id="uploadIcon">📄</div>
    <div class="upload-text" id="uploadText">Click to choose a PDF</div>
    <div class="upload-hint" id="uploadHint">Only PDF files are supported</div>
    <div id="file-name"></div>
  </div>

  <div class="section-label">Print Type</div>
  <div class="type-toggle">
    <input type="radio" name="type" id="bw" value="bw" checked onchange="onTypeChange()">
    <label for="bw">⬛ Black &amp; White<br><small>Rs.2 / page</small></label>
    <input type="radio" name="type" id="color" value="color" onchange="onTypeChange()">
    <label for="color">🎨 Color<br><small>Rs.5 / page</small></label>
  </div>

  <div id="summary">
    <div class="summary-row"><span>File</span><span id="s-file">—</span></div>
    <div class="summary-row"><span>Pages</span><span id="s-pages">—</span></div>
    <div class="summary-row"><span>Print Type</span><span id="s-type">—</span></div>
    <div class="summary-row"><span>Price per page</span><span id="s-ppp">—</span></div>
    <div class="summary-total"><span>Total</span><span id="s-total">Rs.0</span></div>
  </div>

  <button class="btn-upload" id="uploadBtn" onclick="uploadFile()" disabled>
    Upload &amp; Print
  </button>

  <div id="status"></div>

  <div class="footer-link">
    <a href="/admin.html">View Print Dashboard →</a>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://hommwwdjqzkcoxheerxl.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhvbW13d2RqcXprY294aGVlcnhsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0NzQ4NTIsImV4cCI6MjA5NjA1MDg1Mn0.ZGp5GZpkcDrjyywfSBQjk2PmIKbJwtDKUs4ruAlNTNY";

const BW_PRICE = 2;
const COLOR_PRICE = 5;

let selectedFile = null;
let pageCount = 0;
let printType = "bw";

function setStatus(msg, type) {
  const el = document.getElementById("status");
  el.innerText = msg;
  el.className = type;
}

function updateSummary() {
  if (!selectedFile || pageCount === 0) return;
  const pricePerPage = printType === "color" ? COLOR_PRICE : BW_PRICE;
  const total = pageCount * pricePerPage;
  const sizeKB = Math.round(selectedFile.size / 1024);
  const sizeStr = sizeKB > 1024 ? (sizeKB/1024).toFixed(1) + " MB" : sizeKB + " KB";

  document.getElementById("s-file").innerText = selectedFile.name + " (" + sizeStr + ")";
  document.getElementById("s-pages").innerText = pageCount;
  document.getElementById("s-type").innerText = printType === "color" ? "Color" : "Black & White";
  document.getElementById("s-ppp").innerText = "Rs." + pricePerPage;
  document.getElementById("s-total").innerText = "Rs." + total;
  document.getElementById("summary").style.display = "block";
  document.getElementById("uploadBtn").disabled = false;
}

function onTypeChange() {
  printType = document.querySelector('input[name="type"]:checked').value;
  if (pageCount > 0) updateSummary();
}

async function onFileSelect() {
  selectedFile = document.getElementById("fileInput").files[0];
  const area = document.getElementById("uploadArea");
  const nameEl = document.getElementById("file-name");
  const btn = document.getElementById("uploadBtn");

  if (!selectedFile) {
    area.className = "upload-area";
    nameEl.style.display = "none";
    document.getElementById("summary").style.display = "none";
    btn.disabled = true;
    return;
  }

  area.className = "upload-area loading";
  document.getElementById("uploadIcon").innerText = "⏳";
  document.getElementById("uploadText").innerText = "Reading PDF...";
  document.getElementById("uploadHint").innerText = "Calculating pages & cost";
  nameEl.style.display = "none";
  btn.disabled = true;

  try {
    const arrayBuffer = await selectedFile.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
    pageCount = pdf.numPages;
  } catch (e) {
    pageCount = 0;
  }

  area.className = "upload-area has-file";
  document.getElementById("uploadIcon").innerText = "✅";
  document.getElementById("uploadText").innerText = selectedFile.name;
  document.getElementById("uploadHint").innerText = pageCount + " page" + (pageCount !== 1 ? "s" : "") + " detected";
  nameEl.style.display = "none";

  updateSummary();
}

async function uploadFile() {
  const btn = document.getElementById("uploadBtn");
  if (!selectedFile) return;

  const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const pricePerPage = printType === "color" ? COLOR_PRICE : BW_PRICE;
  const total = pageCount * pricePerPage;

  btn.disabled = true;
  btn.innerText = "Uploading...";
  setStatus("Uploading your file, please wait...", "info");

  try {
    const fileName = Date.now() + "_" + selectedFile.name;

    const { error: uploadError } = await client.storage
      .from("print-files").upload(fileName, selectedFile);

    if (uploadError) {
      setStatus("Upload failed: " + uploadError.message, "error");
      btn.disabled = false; btn.innerText = "Upload & Print"; return;
    }

    const { data: urlData } = client.storage.from("print-files").getPublicUrl(fileName);

    const { error: dbError } = await client.from("print_jobs").insert([{
      file_name: selectedFile.name,
      file_url: urlData.publicUrl,
      pages: pageCount,
      print_type: printType,
      price: total,
      status: "pending"
    }]);

    if (dbError) {
      setStatus("Database error: " + dbError.message, "error");
      btn.disabled = false; btn.innerText = "Upload & Print"; return;
    }

    setStatus("Uploaded successfully! Check the dashboard to print.", "success");
    btn.innerText = "Uploaded!";

    setTimeout(() => {
      selectedFile = null; pageCount = 0;
      document.getElementById("fileInput").value = "";
      document.getElementById("uploadArea").className = "upload-area";
      document.getElementById("uploadIcon").innerText = "📄";
      document.getElementById("uploadText").innerText = "Click to choose a PDF";
      document.getElementById("uploadHint").innerText = "Only PDF files are supported";
      document.getElementById("summary").style.display = "none";
      document.getElementById("status").className = "";
      btn.disabled = true;
      btn.innerText = "Upload & Print";
    }, 2500);

  } catch (err) {
    setStatus("Unexpected error: " + err.message, "error");
    btn.disabled = false; btn.innerText = "Upload & Print";
  }
}
</script>

</body>
</html>
