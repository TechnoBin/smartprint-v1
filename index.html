<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>SmartPrint</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --ink:#0f172a; --muted:#64748b; --line:#e2e8f0; --soft:#f8fafc; --blue:#2563eb; }
    body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:#f1f5f9; min-height:100vh; color:var(--ink); padding:16px; }
    .page { width:100%; max-width:520px; margin:0 auto; padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
    .card { background:#fff; border:1px solid rgba(226,232,240,.9); border-radius:20px; padding:20px; box-shadow:0 10px 35px rgba(15,23,42,.08); }
    .brand { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:22px; }
    .brand-main { display:flex; align-items:center; gap:10px; }
    .brand-icon { width:42px; height:42px; border-radius:12px; display:grid; place-items:center; background:#eff6ff; font-size:21px; }
    .brand-name { font-size:20px; font-weight:800; letter-spacing:-.3px; }
    .brand-sub { font-size:11px; color:#94a3b8; margin-top:2px; }
    .profile-chip { border:1px solid var(--line); background:#fff; color:#475569; border-radius:999px; padding:7px 10px; font-size:12px; cursor:pointer; }
    .section-label { font-size:11px; font-weight:800; color:#64748b; text-transform:uppercase; letter-spacing:.08em; margin:18px 0 8px; }
    .input-wrap { position:relative; }
    .input-wrap input { width:100%; padding:13px 42px 13px 42px; border:1.5px solid var(--line); border-radius:12px; font:inherit; font-size:15px; color:var(--ink); outline:none; background:#fff; }
    .input-wrap input:focus { border-color:#60a5fa; box-shadow:0 0 0 3px rgba(59,130,246,.10); }
    .input-wrap input.filled { border-color:#86efac; }
    .input-icon { position:absolute; left:14px; top:50%; transform:translateY(-50%); pointer-events:none; }
    .edit-name { position:absolute; right:8px; top:50%; transform:translateY(-50%); border:0; background:var(--soft); color:#475569; border-radius:8px; padding:6px 8px; font-size:12px; cursor:pointer; }
    .upload-area { border:2px dashed #cbd5e1; border-radius:15px; padding:30px 16px; text-align:center; cursor:pointer; background:var(--soft); position:relative; transition:.2s; }
    .upload-area:hover,.upload-area:focus-within { border-color:#60a5fa; background:#eff6ff; }
    .upload-area.loading { border-color:#f59e0b; background:#fffbeb; }
    .upload-area.has-file { border-color:#22c55e; background:#f0fdf4; }
    .upload-area input[type=file] { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
    .upload-icon { font-size:34px; margin-bottom:8px; }
    .upload-text { font-size:14px; font-weight:700; color:#334155; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .upload-hint { font-size:12px; color:#94a3b8; margin-top:5px; }
    .type-toggle { display:flex; border:1px solid var(--line); border-radius:12px; overflow:hidden; }
    .type-toggle input { display:none; }
    .type-toggle label { flex:1; text-align:center; padding:12px 8px; font-size:13px; font-weight:700; color:#64748b; cursor:pointer; background:#fff; transition:.15s; line-height:1.45; }
    .type-toggle label + label { border-left:1px solid var(--line); }
    .type-toggle input:checked + label { background:var(--ink); color:#fff; }
    #summary { background:var(--soft); border:1px solid var(--line); border-radius:14px; padding:14px; margin-top:18px; }
    .summary-row,.summary-total { display:flex; justify-content:space-between; gap:12px; padding:5px 0; font-size:13px; }
    .summary-row span:first-child { color:var(--muted); }
    .summary-row span:last-child { font-weight:650; text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .summary-total { margin-top:7px; padding-top:11px; border-top:1px solid var(--line); font-size:15px; font-weight:800; }
    .summary-total span:last-child { color:#16a34a; font-size:17px; }
    .btn-upload { width:100%; margin-top:16px; padding:14px; background:var(--blue); color:#fff; border:0; border-radius:12px; font:inherit; font-size:15px; font-weight:800; cursor:pointer; min-height:50px; box-shadow:0 6px 16px rgba(37,99,235,.18); }
    .btn-upload:active:not(:disabled) { transform:translateY(1px); }
    .btn-upload:disabled { background:#e2e8f0; color:#94a3b8; box-shadow:none; cursor:not-allowed; }
    #status { margin-top:12px; padding:12px 14px; border-radius:11px; font-size:13px; font-weight:650; display:none; }
    #status.info { display:block; background:#dbeafe; color:#1d4ed8; }
    #status.success { display:block; background:#dcfce7; color:#15803d; }
    #status.error { display:block; background:#fee2e2; color:#b91c1c; }
    .print-status { display:none; margin-top:14px; border-radius:15px; border:1px solid var(--line); overflow:hidden; }
    .print-status.show { display:block; }
    .status-head { display:flex; align-items:center; gap:12px; padding:15px; }
    .status-icon { width:42px; height:42px; border-radius:12px; display:grid; place-items:center; font-size:21px; flex:0 0 auto; }
    .status-title { font-size:14px; font-weight:850; }
    .status-text { font-size:12px; color:#64748b; margin-top:3px; line-height:1.4; }
    .status-job { border-top:1px solid rgba(148,163,184,.18); padding:10px 15px; display:flex; justify-content:space-between; gap:10px; font-size:11px; color:#64748b; background:rgba(255,255,255,.45); }
    .status-pending { background:#fffbeb; border-color:#fde68a; } .status-pending .status-icon { background:#fef3c7; }
    .status-printing { background:#eff6ff; border-color:#bfdbfe; } .status-printing .status-icon { background:#dbeafe; }
    .status-printed { background:#f0fdf4; border-color:#bbf7d0; } .status-printed .status-icon { background:#dcfce7; }
    .status-failed { background:#fef2f2; border-color:#fecaca; } .status-failed .status-icon { background:#fee2e2; }
    .status-loading { background:#f8fafc; border-color:#e2e8f0; }
    .print-history { display: none; margin-top: 14px; }
    .print-history.show { display: block; }
    .history-heading { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
    .history-title { font-size: 11px; font-weight: 850; color: #64748b; text-transform: uppercase; letter-spacing: .08em; }
    .history-subtitle { font-size: 11px; color: #94a3b8; }
    .history-list { display: flex; flex-direction: column; gap: 8px; }
    .history-item { display: flex; align-items: center; gap: 11px; padding: 12px; background: #fff; border: 1px solid var(--line); border-radius: 13px; transition: .15s; }
    .history-item.active { border-color: #93c5fd; background: #f8fbff; }
    .history-item-icon { width: 36px; height: 36px; flex: 0 0 auto; display: grid; place-items: center; border-radius: 10px; font-size: 18px; background: #f1f5f9; }
    .history-item-main { min-width: 0; flex: 1; }
    .history-file { font-size: 13px; font-weight: 750; color: #334155; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .history-meta { display: flex; align-items: center; gap: 6px; margin-top: 3px; font-size: 11px; color: #94a3b8; }
    .history-status { font-size: 11px; font-weight: 800; white-space: nowrap; }
    .history-status.pending { color: #d97706; }
    .history-status.printing { color: #2563eb; }
    .history-status.printed { color: #16a34a; }
    .history-status.failed { color: #dc2626; }
    .secondary-actions { display:none; gap:8px; margin-top:10px; }
    .secondary-actions.show { display:flex; }
    .secondary-actions button { flex:1; min-height:42px; border:1px solid var(--line); background:#fff; color:#334155; border-radius:10px; font-weight:700; cursor:pointer; }

    
    .welcome { display:none; margin:-6px 0 16px; font-size:13px; color:#64748b; }
    .welcome.show { display:block; }
    .modal-backdrop { position:fixed; inset:0; background:rgba(15,23,42,.42); display:none; align-items:flex-end; justify-content:center; padding:14px; z-index:20; }
    .modal-backdrop.show { display:flex; }
    .modal { width:min(100%,420px); background:#fff; border-radius:18px; padding:18px; box-shadow:0 20px 50px rgba(15,23,42,.22); }
    .modal h3 { font-size:17px; margin-bottom:5px; } .modal p { font-size:12px; color:#64748b; margin-bottom:13px; }
    .modal input { width:100%; padding:12px; border:1px solid var(--line); border-radius:10px; font:inherit; outline:none; }
    .history-file-link {
  font-size: 13px;
  font-weight: 750;
  color: var(--blue);
  text-decoration: none;
  display: inline-block;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.history-file-link:hover {
  text-decoration: underline;
}
    .history-toggle-btn {
  width: 100%;
  margin-top: 8px;
  padding: 8px;
  background: transparent;
  border: 1px dashed var(--line);
  border-radius: 10px;
  color: #64748b;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  transition: .15s;
}
.history-toggle-btn:hover {
  background: var(--soft);
  color: var(--ink);
}

    .modal-actions { display:flex; gap:8px; margin-top:12px; } .modal-actions button { flex:1; min-height:42px; border-radius:10px; border:1px solid var(--line); font-weight:700; cursor:pointer; background:#fff; } .modal-actions .save { background:var(--ink); color:#fff; border-color:var(--ink); }
    @media (min-width:600px) { body { padding:28px 20px; } .card { padding:28px; } }
    @media (max-width:380px) { body { padding:10px; } .card { padding:16px; border-radius:17px; } .brand { margin-bottom:17px; } .profile-chip { font-size:11px; padding:6px 8px; } }
  </style>
</head>
<body>
<div class="page">
  <main class="card">
    <div class="brand">
      <div class="brand-main"><div class="brand-icon">🖨️</div><div><div class="brand-name">SmartPrint</div><div class="brand-sub">Quick & simple document printing</div></div></div>
    </div>

    <div class="welcome" id="welcome"></div>

    <div class="section-label">Your name</div>
    <div class="input-wrap">
      <span class="input-icon">👤</span>
      <input type="text" id="customerName" maxlength="60" placeholder="Enter your name" autocomplete="name" oninput="checkReady()">
      <button class="edit-name" id="editNameBtn" type="button" onclick="openNameEditor()">Edit</button>
    </div>

    <div class="section-label">Upload PDF</div>
    <div class="upload-area" id="uploadArea">
      <input type="file" id="fileInput" accept="application/pdf,.pdf" onchange="onFileSelect()">
      <div class="upload-icon" id="uploadIcon">📄</div>
      <div class="upload-text" id="uploadText">Tap to choose a PDF</div>
      <div class="upload-hint" id="uploadHint">PDF files only</div>
    </div>

    <div class="section-label">Print type</div>
    <div class="type-toggle">
      <input type="radio" name="type" id="bw" value="bw" checked onchange="onTypeChange()"><label for="bw">⬛ Black &amp; White<br><small>Rs.2 / page</small></label>
      <input type="radio" name="type" id="color" value="color" onchange="onTypeChange()"><label for="color">🎨 Color<br><small>Rs.5 / page</small></label>
    </div>

    <div id="summary" style="display:none">
      <div class="summary-row"><span>Customer</span><span id="s-customer">—</span></div>
      <div class="summary-row"><span>File</span><span id="s-file">—</span></div>
      <div class="summary-row"><span>Pages</span><span id="s-pages">—</span></div>
      <div class="summary-row"><span>Print type</span><span id="s-type">—</span></div>
      <div class="summary-row"><span>Price per page</span><span id="s-ppp">—</span></div>
      <div class="summary-total"><span>Total</span><span id="s-total">Rs.0</span></div>
    </div>

    <button class="btn-upload" id="uploadBtn" onclick="uploadFile()" disabled>Upload &amp; Print</button>
    <div id="status"></div>

    <div class="print-status" id="printStatus">
      <div class="status-head"><div class="status-icon" id="printStatusIcon">⏳</div><div><div class="status-title" id="printStatusTitle">Print status</div><div class="status-text" id="printStatusText">Checking your job...</div></div></div>
      <div class="status-job"><span id="statusFile">—</span><span id="statusUpdated">—</span></div>
    </div>
    
    <div class="print-history" id="printHistory">
      <div class="history-heading">
        <div class="history-title">Print history</div>
        <div class="history-subtitle" id="historyCount"></div>
      </div>
      <div class="history-list" id="historyList"></div>
    </div>

    <div class="secondary-actions" id="secondaryActions"><button type="button" onclick="startNewPrint()">＋ New print</button><button type="button" onclick="openNameEditor()">✏️ Edit name</button></div>
    
  </main>
</div>

<div class="modal-backdrop" id="nameModal" onclick="if(event.target===this)closeNameEditor()">
  <div class="modal">
    <h3>Edit your name</h3><p>This name is used on your print records.</p>
    <input id="nameEditor" maxlength="60" placeholder="Enter your name" autocomplete="name">
    <div class="modal-actions"><button type="button" onclick="closeNameEditor()">Cancel</button><button class="save" type="button" onclick="saveName()">Save</button></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js";

let historyExpanded = false;
let cachedHistoryJobs = [];
  
const SUPABASE_URL = "https://hommwwdjqzkcoxheerxl.supabase.co";
const SUPABASE_KEY = "sb_publishable_muM1Xml6MpBwct6-kpvZXg_ejuz9Z8V";
const BW_PRICE = 2, COLOR_PRICE = 5;
const MAX_FILE_SIZE = 25 * 1024 * 1024;
const DEVICE_KEY = "smartprint_device_id_v1";
const NAME_KEY = "smartprint_customer_name_v1";
const JOB_KEY = "smartprint_last_job_id_v1";
let selectedFile = null, pageCount = 0, printType = "bw", readingPDF = false, currentJobId = null, statusCheckInterval = null;
const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function getDeviceId() {
  let id = localStorage.getItem(DEVICE_KEY);
  if (!id) { id = (crypto.randomUUID ? crypto.randomUUID() : fallbackId()); localStorage.setItem(DEVICE_KEY, id); }
  return id;
}
function fallbackId() { return "sp-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2,12); }
const deviceId = getDeviceId();

function setStatus(msg, type) { const el=document.getElementById("status"); el.textContent=msg; el.className=type||""; }
function setWelcome() { const name=localStorage.getItem(NAME_KEY)||""; const input=document.getElementById("customerName"); input.value=name; input.className=name?"filled":""; document.getElementById("welcome").textContent=name?`Welcome back, ${name} 👋`:""; document.getElementById("welcome").classList.toggle("show",!!name); }
function openNameEditor(){ document.getElementById("nameEditor").value=document.getElementById("customerName").value.trim(); document.getElementById("nameModal").classList.add("show"); setTimeout(()=>document.getElementById("nameEditor").focus(),50); }
function closeNameEditor(){ document.getElementById("nameModal").classList.remove("show"); }
function saveName(){ const name=document.getElementById("nameEditor").value.trim(); if(!name){ alert("Please enter your name."); return; } localStorage.setItem(NAME_KEY,name); document.getElementById("customerName").value=name; document.getElementById("customerName").className="filled"; setWelcome(); updateSummary(); checkReady(); closeNameEditor(); }
function checkReady(){ const name=document.getElementById("customerName").value.trim(); const input=document.getElementById("customerName"); input.className=name?"filled":""; const ready=name && selectedFile && pageCount>0 && !readingPDF; document.getElementById("uploadBtn").disabled=!ready; if(ready) updateSummary(); }
function updateSummary(){ const name=document.getElementById("customerName").value.trim(); if(!selectedFile||!pageCount||!name)return; const p=printType==="color"?COLOR_PRICE:BW_PRICE, total=pageCount*p, kb=Math.round(selectedFile.size/1024); const size=kb>1024?(kb/1024).toFixed(1)+" MB":kb+" KB"; document.getElementById("s-customer").textContent=name; document.getElementById("s-file").textContent=selectedFile.name+" ("+size+")"; document.getElementById("s-pages").textContent=pageCount; document.getElementById("s-type").textContent=printType==="color"?"Color":"Black & White"; document.getElementById("s-ppp").textContent="Rs."+p; document.getElementById("s-total").textContent="Rs."+total; document.getElementById("summary").style.display="block"; }
function onTypeChange(){ printType=document.querySelector('input[name="type"]:checked').value; if(pageCount)updateSummary(); }

async function onFileSelect() {
  const file = document.getElementById("fileInput").files[0];
  selectedFile = file || null;
  pageCount = 0;
  readingPDF = false;

  if (!file) {
    resetFileUI();
    checkReady();
    return;
  }

  if (file.size > MAX_FILE_SIZE) {
    setStatus("File is too large. Max size is 25MB.", "error");
    resetFileUI();
    checkReady();
    return;
  }

  readingPDF = true;
  document.getElementById("uploadArea").classList.add("loading");

  try {
    const arrayBuffer = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
    pageCount = pdf.numPages;
    
    document.getElementById("uploadArea").classList.remove("loading");
    document.getElementById("uploadArea").classList.add("has-file");
    document.getElementById("uploadIcon").textContent = "✓";
    document.getElementById("uploadText").textContent = file.name;
    document.getElementById("uploadHint").textContent = `${pageCount} page${pageCount !== 1 ? "s" : ""}`;
    
    readingPDF = false;
    checkReady();
  } catch (err) {
    console.error("PDF reading error:", err);
    setStatus("Could not read PDF file. Please try another file.", "error");
    resetFileUI();
    readingPDF = false;
  }
}

function resetFileUI(clearInput=true){ selectedFile=null; pageCount=0; readingPDF=false; if(clearInput)document.getElementById("fileInput").value=""; document.getElementById("uploadArea").className="upload-area"; document.getElementById("uploadIcon").textContent="📄"; document.getElementById("uploadText").textContent="Tap to choose a PDF"; document.getElementById("uploadHint").textContent="PDF files only"; document.getElementById("summary").style.display="none"; document.getElementById("uploadBtn").disabled=true; }

function normalizeStatus(status) {
  if (status === "done") return "printed";
  return status || "pending";
}

function getStatusInfo(status) {
  status = normalizeStatus(status);
  const map = {
    pending: { icon: "⏳", title: "Print pending", text: "Your document is waiting to be printed." },
    printing: { icon: "🖨️", title: "Printing", text: "Your document is currently being printed." },
    printed: { icon: "✅", title: "Printed successfully", text: "Your document has been printed." },
    failed: { icon: "⚠️", title: "Print failed", text: "We could not complete this print job." }
  };
  return map[status] || { icon: "⏳", title: "Checking status", text: "Checking your print job..." };
}

// Helper function to reliably parse Supabase UTC strings into local Date objects
function parseDate(dateValue) {
  if (!dateValue) return null;
  if (dateValue instanceof Date) return dateValue;

  let str = String(dateValue).trim().replace(" ", "T");

  // If the string lacks a timezone offset or 'Z', append 'Z' so JS treats it as UTC
  if (!str.endsWith("Z") && !/[+-]\d{2}:?\d{2}$/.test(str)) {
    str += "Z";
  }

  const date = new Date(str);
 return Number.isNaN(date.getTime()) ? null : date;
}

function formatTime(dateValue) {
  const date = parseDate(dateValue);
  if (!date) return "";

  return date.toLocaleTimeString([], {
    hour: "2-digit",
    minute: "2-digit",
    hour12: true
  });
}

function formatDate(dateValue) {
  const date = parseDate(dateValue);
  if (!date) return "";

  const today = new Date();
  if (date.toDateString() === today.toDateString()) {
    return formatTime(date);
  }

  return (
    date.toLocaleDateString([], {
      day: "numeric",
      month: "short"
    }) +
    " · " +
    formatTime(date)
  );
}


function escapeHtml(value) {
  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function updatePrintStatus(status, fileName, updatedAt) {
  status = normalizeStatus(status);
  const box = document.getElementById("printStatus");
  box.className = "print-status show status-" + status;

  const info = getStatusInfo(status);
  document.getElementById("printStatusIcon").textContent = info.icon;
  document.getElementById("printStatusTitle").textContent = info.title;
  document.getElementById("printStatusText").textContent = info.text;
  document.getElementById("statusFile").textContent = fileName || "Print job";
  document.getElementById("statusUpdated").textContent = formatTime(updatedAt);
  document.getElementById("secondaryActions").classList.toggle("show", status === "printed");
}

function toggleHistoryExpand() {
  historyExpanded = !historyExpanded;
  renderHistory(cachedHistoryJobs);
}

function renderHistory(jobs) {
  cachedHistoryJobs = jobs || [];

  const historyBox = document.getElementById("printHistory");
  const historyList = document.getElementById("historyList");
  const historyCount = document.getElementById("historyCount");

  const historyJobs = cachedHistoryJobs.filter(job => job.id !== currentJobId);

  if (!historyJobs.length) {
    historyBox.classList.remove("show");
    historyList.innerHTML = "";
    historyCount.textContent = "";
    return;
  }

  historyBox.classList.add("show");
  historyCount.textContent = historyJobs.length + (historyJobs.length === 1 ? " print" : " prints");

  // Show top 3 by default
  const LIMIT = 3;
  const displayJobs = historyExpanded ? historyJobs : historyJobs.slice(0, LIMIT);

  historyList.innerHTML = displayJobs.map(job => {
    const status = normalizeStatus(job.status);
    const info = getStatusInfo(status);
    const printType = job.print_type === "color" ? "Color" : "B&W";
    const price = job.price !== null && job.price !== undefined ? `₹${job.price}` : "";

    const fileLink = job.file_url 
      ? `<a href="${escapeHtml(job.file_url)}" target="_blank" rel="noopener noreferrer" class="history-file-link" title="Open PDF">${escapeHtml(job.file_name || "Untitled PDF")} ↗</a>`
      : `<div class="history-file" title="${escapeHtml(job.file_name)}">${escapeHtml(job.file_name || "Untitled PDF")}</div>`;

    return `
      <div class="history-item">
        <div class="history-item-icon">${info.icon}</div>
        <div class="history-item-main">
          ${fileLink}
          <div class="history-meta">
            <span>${formatDate(job.updated_at || job.created_at)}</span>
            ${job.pages ? `<span>·</span><span>${job.pages} page${job.pages === 1 ? "" : "s"}</span>` : ""}
            <span>·</span><span>${printType}</span>
            ${price ? `<span>·</span><span>${price}</span>` : ""}
          </div>
        </div>
        <div class="history-status ${status}">
          ${status === "pending" ? "Pending" : status === "printing" ? "Printing" : status === "printed" ? "Printed" : "Failed"}
        </div>
      </div>
    `;
  }).join("");

  // Handle See all / Show less button
  let toggleBtn = document.getElementById("historyToggleBtn");
  if (historyJobs.length > LIMIT) {
    if (!toggleBtn) {
      toggleBtn = document.createElement("button");
      toggleBtn.id = "historyToggleBtn";
      toggleBtn.className = "history-toggle-btn";
      toggleBtn.type = "button";
      toggleBtn.onclick = toggleHistoryExpand;
      historyBox.appendChild(toggleBtn);
    }
    toggleBtn.style.display = "block";
    toggleBtn.textContent = historyExpanded 
      ? "Show less ↑" 
      : `See all (${historyJobs.length}) ↓`;
  } else if (toggleBtn) {
    toggleBtn.style.display = "none";
  }
}

async function loadPrintHistory() {
  const { data, error } = await client
    .from("print_jobs")
    .select(`id, status, file_name, file_url, pages, print_type, price, created_at`)
    .eq("device_id", deviceId)
    .order("created_at", { ascending: false });

  if (error) {
    console.warn("Could not load print history:", error.message);
    return [];
  }
  return data || [];
}

async function checkPrintStatus() {
  if (!currentJobId) return;

  const { data, error } = await client
    .from("print_jobs")
    .select(`id, status, file_name, created_at, pages, print_type, price`)
    .eq("id", currentJobId)
    .eq("device_id", deviceId)
    .maybeSingle();

  if (error || !data) return;

  const status = normalizeStatus(data.status);
  updatePrintStatus(status, data.file_name, data.created_at);

  const jobs = await loadPrintHistory();
  renderHistory(jobs);

  if (status === "printed" || status === "failed") stopPolling();
}

function startPolling() {
  stopPolling();
  checkPrintStatus();
  statusCheckInterval = setInterval(checkPrintStatus, 3000);
}

function stopPolling() {
  if (statusCheckInterval) {
    clearInterval(statusCheckInterval);
    statusCheckInterval = null;
  }
}

async function restorePrintState() {
  const jobs = await loadPrintHistory();

  if (!jobs.length) {
    currentJobId = null;
    document.getElementById("printStatus").className = "print-status";
    document.getElementById("secondaryActions").classList.remove("show");
    renderHistory([]);
    return;
  }

  // Check if there is an active print job in progress (pending or printing)
  const activeJob = jobs.find(job => {
    const status = normalizeStatus(job.status);
    return status === "pending" || status === "printing";
  });

  if (activeJob) {
    // Keep showing live status for ongoing jobs
    currentJobId = activeJob.id;
    localStorage.setItem(JOB_KEY, currentJobId);
    updatePrintStatus(normalizeStatus(activeJob.status), activeJob.file_name, activeJob.created_at);
    renderHistory(jobs);
    startPolling();
  } else {
    // All jobs are finished/printed: move everything to History & clear active status box
    currentJobId = null;
    localStorage.removeItem(JOB_KEY);
    document.getElementById("printStatus").className = "print-status";
    document.getElementById("secondaryActions").classList.remove("show");
    renderHistory(jobs);
    stopPolling();
  }
}


async function uploadFile() {
  const btn = document.getElementById("uploadBtn");
  const name = document.getElementById("customerName").value.trim();

  if (!selectedFile || !name || pageCount <= 0) {
    setStatus("Please select a valid file and enter your name.", "error");
    return;
  }

  localStorage.setItem(NAME_KEY, name);
  btn.disabled = true;
  btn.textContent = "Uploading...";
  setStatus("Uploading your PDF, please wait...", "info");

  try {
    const fileName = Date.now() + "_" + Math.random().toString(36).slice(2, 8) + "_" + selectedFile.name;

    const { error: uploadError } = await client.storage
      .from("print-files")
      .upload(fileName, selectedFile, { contentType: "application/pdf", upsert: false });

    if (uploadError) throw new Error("Upload failed: " + uploadError.message);

    const { data: urlData, error: urlError } = client.storage
      .from("print-files")
      .getPublicUrl(fileName);

    if (urlError || !urlData?.publicUrl) throw new Error("Could not get file URL");

    const total = pageCount * (printType === "color" ? COLOR_PRICE : BW_PRICE);

    const { data: jobData, error: dbError } = await client
      .from("print_jobs")
      .insert([{
        customer_name: name,
        device_id: deviceId,
        file_name: selectedFile.name,
        file_url: urlData.publicUrl,
        pages: pageCount,
        print_type: printType,
        price: total,
        status: "pending"
      }])
      .select("id, status, file_name, created_at")
      .single();

    if (dbError) throw new Error("Database error: " + dbError.message);

    currentJobId = jobData.id;
    localStorage.setItem(JOB_KEY, currentJobId);

    setStatus("Your PDF has been uploaded successfully.", "success");
    updatePrintStatus("pending", jobData.file_name, jobData.created_at);

    btn.textContent = "Uploaded ✓";
    document.getElementById("summary").style.display = "none";
    resetFileUI();

    const jobs = await loadPrintHistory();
    renderHistory(jobs);
    startPolling();

  } catch (err) {
    console.error("Upload error:", err);
    setStatus(err.message || "Something went wrong.", "error");
    btn.disabled = false;
    btn.textContent = "Upload & Print";
  }
}

function startNewPrint() {
  stopPolling();
  currentJobId = null;
  document.getElementById("printStatus").className = "print-status";
  document.getElementById("secondaryActions").classList.remove("show");
  setStatus("", "");
  resetFileUI();
  document.getElementById("uploadBtn").textContent = "Upload & Print";
  document.getElementById("customerName").value = localStorage.getItem(NAME_KEY) || "";
  checkReady();
  loadPrintHistory();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

setWelcome();
restorePrintState();
</script>
