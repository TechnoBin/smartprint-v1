<!DOCTYPE html>
<html>
<head>
  <title>SmartPrint V1</title>
</head>
<body>

<h2>SmartPrint - Upload PDF</h2>

<input type="file" id="fileInput" accept="application/pdf" />
<button onclick="uploadFile()">Upload</button>

<p id="status"></p>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const supabaseUrl = "https://hommwwdjqzkcoxheerxl.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhvbW13d2RqcXprY294aGVlcnhsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0NzQ4NTIsImV4cCI6MjA5NjA1MDg1Mn0.ZGp5GZpkcDrjyywfSBQjk2PmIKbJwtDKUs4ruAlNTNY";
const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

async function uploadFile() {
  const file = document.getElementById("fileInput").files[0];
  const status = document.getElementById("status");

  if (!file) {
    status.innerText = "❌ Please select a PDF file";
    return;
  }

  try {
    const fileName = Date.now() + "_" + file.name;

    status.innerText = "⏳ Uploading... please wait";

    // 1. Upload to Supabase Storage
    const { data, error: uploadError } = await supabase.storage
      .from("print-files")
      .upload(fileName, file);

    if (uploadError) {
      console.log(uploadError);
      status.innerText = "❌ Upload failed: " + uploadError.message;
      return;
    }

    // 2. Get public URL
    const { data: urlData } = supabase.storage
      .from("print-files")
      .getPublicUrl(fileName);

    const fileUrl = urlData.publicUrl;

    // 3. Save to database
    const { error: dbError } = await supabase
      .from("print_jobs")
      .insert([
        {
          file_name: file.name,
          file_url: fileUrl
        }
      ]);

    if (dbError) {
      console.log(dbError);
      status.innerText = "❌ Database error: " + dbError.message;
      return;
    }

    status.innerText = "✅ Upload successful!";
  } catch (err) {
    console.log(err);
    status.innerText = "❌ Unexpected error: " + err.message;
  }
}

</script>

</body>
</html>
