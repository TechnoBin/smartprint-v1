<!DOCTYPE html>
<html>
<head>
  <title>SmartPrint Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f1f5f9;
      min-height: 100vh;
      padding: 30px 20px;
    }

    header {
      max-width: 700px;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }

    header h2 { font-size: 22px; color: #1e293b; }

    header span {
      font-size: 13px;
      color: #64748b;
      background: #e2e8f0;
      padding: 4px 12px;
      border-radius: 20px;
    }

    .filters {
      max-width: 700px;
      margin: 0 auto 16px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    #status {
      max-width: 700px;
      margin: 0 auto 16px;
      font-size: 14px;
      color: #64748b;
      padding: 10px 14px;
      background: #fff;
      border-radius: 8px;
      border-left: 4px solid #94a3b8;
    }

    #status.error  { color: #b91c1c; border-left-color: #ef4444; background: #fef2f2; }
    #status.success { color: #15803d; border-left-color: #22c55e; background: #f0fdf4; }

    #jobs {
      max-width: 700px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .job {
      background: #fff;
      border-radius: 10px;
      padding: 16px 20px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .job-info { display: flex; align-items: center; gap: 12px; overflow: hidden; }
    .job-icon { font-size: 28px; flex-shrink: 0; }

    .job-name {
      font-weight: 600;
      color: #1e293b;
      font-size: 15px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 280px;
    }

    .job-status-badge {
      font-size: 12px;
      font-weight: 600;
      margin-top: 3px;
    }

    .job-time { font-size: 12px; color: #94a3b8; margin-top: 2px; }
    .job-actions { display: flex; gap: 8px; flex-shrink: 0; }

    .btn {
      padding: 7px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .btn-outline { background: #f1f5f9; color: #334155; border: 1px solid #cbd5e1; }
    .btn-outline:hover { background: #e2e8f0; }
    .btn-primary { background: #3b82f6; color: #fff; }
    .btn-primary:hover { background: #2563eb; }
    .btn-success { background: #22c55e; color: #fff; }
    .btn-success:hover { background: #16a34a; }
    .btn-active { background: #3b82f6; color: #fff; border-color: #3b82f6; }

    .empty { text-align: center; padding: 60px 20px; color: #94a3b8; background: #fff; border-radius: 10px; }
    .empty-icon { font-size: 48px; margin-bottom: 12px; }
    .empty p { font-size: 15px; }
  </style>
</head>
<body>

<header>
  <h2>Print Dashboard</h2>
  <span id="count">Loading...</span>
</header>

<div class="filters">
  <button onclick="setFilter('all')" class="btn btn-outline" id="filter-all">All</button>
  <button onclick="setFilter('pending')" class="btn btn-outline" id="filter-pending">Pending</button>
  <button onclick="setFilter('printed')" class="btn btn-outline" id="filter-printed">Printed</button>
  <button onclick="setFilter('bw')" class="btn btn-outline" id="filter-bw">B/W</button>
  <button onclick="setFilter('color')" class="btn btn-outline" id="filter-color">Color</button>
</div>

<div id="status">Connecting to database...</div>
<div id="jobs"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://hommwwdjqzkcoxheerxl.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhvbW13d2RqcXprY294aGVlcnhsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0NzQ4NTIsImV4cCI6MjA5NjA1MDg1Mn0.ZGp5GZpkcDrjyywfSBQjk2PmIKbJwtDKUs4ruAlNTNY";

let client;
let currentFilter = "all";

try {
  client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
} catch (err) {
  document.getElementById("status").className = "error";
  document.getElementById("status").innerText = "Could not connect. Refresh the page.";
}

function timeAgo(dateStr) {
  const diff = Math.floor((Date.now() - new Date(dateStr)) / 1000);
  if (diff < 60) return diff + "s ago";
  if (diff < 3600) return Math.floor(diff / 60) + "m ago";
  if (diff < 86400) return Math.floor(diff / 3600) + "h ago";
  return Math.floor(diff / 86400) + "d ago";
}

function setFilter(type) {
  currentFilter = type;
  document.querySelectorAll(".filters .btn").forEach(btn => btn.classList.remove("btn-active"));
  document.getElementById("filter-" + type).classList.add("btn-active");
  loadJobs();
}

async function markPrinted(id) {
  const { error } = await client
    .from("print_jobs")
    .update({ status: "printed" })
    .eq("id", id);

  if (error) {
    alert("Error: " + error.message);
    return;
  }
  loadJobs();
}

function openPrint(url) {
  const win = window.open(url);
  if (!win) {
    alert("Popup blocked! Please allow popups for printing.");
    return;
  }
  win.onload = function() {
    setTimeout(function() { win.print(); }, 500);
  };
}

async function loadJobs() {
  if (!client) return;

  const statusEl = document.getElementById("status");
  const container = document.getElementById("jobs");
  const countEl = document.getElementById("count");

  let query = client
    .from("print_jobs")
    .select("*")
    .order("created_at", { ascending: false });

  if (currentFilter === "pending") query = query.eq("status", "pending");
  if (currentFilter === "printed") query = query.eq("status", "printed");
  if (currentFilter === "bw") query = query.eq("print_type", "bw");
  if (currentFilter === "color") query = query.eq("print_type", "color");

  const { data, error } = await query;

  if (error) {
    statusEl.className = "error";
    statusEl.innerText = "Error: " + error.message;
    countEl.innerText = "Error";
    return;
  }

  countEl.innerText = (data ? data.length : 0) + " job(s)";

  if (!data || data.length === 0) {
    statusEl.className = "";
    statusEl.innerText = "No print jobs found. Upload a PDF to get started.";
    container.innerHTML = '<div class="empty"><div class="empty-icon">📄</div><p>No jobs found.</p></div>';
    return;
  }

  statusEl.className = "success";
  statusEl.innerText = "Live — refreshes every 4 seconds";

  container.innerHTML = data.map(function(job) {
    const isPrinted = job.status === "printed";
    const statusColor = isPrinted ? "#16a34a" : "#f59e0b";
    const statusText = isPrinted ? "Printed" : "Pending";
    const timeStr = job.created_at ? timeAgo(job.created_at) : "";
    const pageInfo = job.pages ? " · " + job.pages + " pages" : "";
    const priceInfo = job.price ? " · Rs." + job.price : "";
    const typeInfo = job.print_type ? " · " + (job.print_type === "bw" ? "B&W" : "Color") : "";

    return '<div class="job">' +
      '<div class="job-info">' +
        '<div class="job-icon">📄</div>' +
        '<div>' +
          '<div class="job-name">' + job.file_name + '</div>' +
          '<div class="job-status-badge" style="color:' + statusColor + '">' + statusText + '</div>' +
          '<div class="job-time">' + timeStr + pageInfo + typeInfo + priceInfo + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="job-actions">' +
        '<a class="btn btn-outline" href="' + job.file_url + '" target="_blank">View</a>' +
        '<button class="btn btn-primary" onclick="openPrint(\'' + job.file_url + '\')">Print</button>' +
        (isPrinted ? '' : '<button class="btn btn-success" onclick="markPrinted(\'' + job.id + '\')">Done</button>') +
      '</div>' +
    '</div>';
  }).join("");
}

if (client) {
  setFilter("all");
  setInterval(loadJobs, 4000);
}
</script>

</body>
</html>
