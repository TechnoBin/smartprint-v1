<!DOCTYPE html>
<html>
<head>
  <title>SmartPrint Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body { font-family: 'Segoe UI', sans-serif; background: #f1f5f9; min-height: 100vh; padding: 28px 20px; }

    header {
      max-width: 760px; margin: 0 auto 20px;
      display: flex; align-items: center;
      justify-content: space-between; flex-wrap: wrap; gap: 10px;
    }

    .header-left h2 { font-size: 22px; font-weight: 700; color: #1e293b; }
    .header-left p  { font-size: 13px; color: #94a3b8; margin-top: 2px; }

    .count-badge {
      background: #1e293b; color: #fff;
      font-size: 13px; font-weight: 600;
      padding: 5px 14px; border-radius: 20px;
    }

    .filters {
      max-width: 760px; margin: 0 auto 12px;
      display: flex; gap: 8px; flex-wrap: wrap;
    }

    .filter-btn {
      padding: 6px 16px; border-radius: 20px;
      font-size: 13px; font-weight: 500;
      cursor: pointer; border: 1.5px solid #e2e8f0;
      background: #fff; color: #64748b; transition: all 0.15s;
    }

    .filter-btn:hover { background: #f1f5f9; }
    .filter-btn.active { background: #1e293b; color: #fff; border-color: #1e293b; }

    /* Selection toolbar */
    .select-bar {
      max-width: 760px; margin: 0 auto 14px;
      display: flex; align-items: center;
      justify-content: space-between; gap: 12px;
      flex-wrap: wrap;
    }

    .select-bar-left { display: flex; align-items: center; gap: 10px; }

    .select-all-label {
      display: flex; align-items: center; gap: 7px;
      font-size: 13px; font-weight: 600; color: #475569;
      cursor: pointer; user-select: none;
    }

    .select-all-label input[type="checkbox"] {
      width: 16px; height: 16px; cursor: pointer; accent-color: #3b82f6;
    }

    .selected-info {
      font-size: 13px; color: #94a3b8;
    }

    .btn-delete-selected {
      display: none;
      padding: 7px 18px; border-radius: 8px;
      font-size: 13px; font-weight: 600;
      cursor: pointer; border: none;
      background: #ef4444; color: #fff;
      transition: background 0.15s;
      align-items: center; gap: 6px;
    }

    .btn-delete-selected.visible { display: inline-flex; }
    .btn-delete-selected:hover { background: #dc2626; }

    #jobs { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }

    .job {
      background: #fff; border-radius: 14px;
      padding: 18px 20px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.07);
      display: flex; align-items: center;
      justify-content: space-between; gap: 14px;
      border-left: 4px solid #e2e8f0;
      transition: opacity 0.3s, box-shadow 0.15s;
    }

    .job.is-pending { border-left-color: #f59e0b; }
    .job.is-printed { border-left-color: #22c55e; opacity: 0.65; }
    .job.is-selected { box-shadow: 0 0 0 2px #3b82f6; opacity: 1 !important; }

    /* Checkbox column */
    .job-checkbox { flex-shrink: 0; }
    .job-checkbox input[type="checkbox"] {
      width: 17px; height: 17px; cursor: pointer; accent-color: #3b82f6;
    }

    .job-left { display: flex; align-items: center; gap: 14px; overflow: hidden; flex: 1; }

    .job-icon {
      width: 44px; height: 44px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; flex-shrink: 0;
      background: #eff6ff;
    }

    .job.is-printed .job-icon { background: #f0fdf4; }

    .job-details { overflow: hidden; }

    .job-customer {
      font-size: 15px; font-weight: 700; color: #1e293b;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .job-filename {
      font-size: 12px; color: #64748b; margin-top: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      max-width: 280px;
    }

    .job-tags { display: flex; align-items: center; gap: 6px; margin-top: 6px; flex-wrap: wrap; }

    .tag {
      font-size: 11px; font-weight: 600;
      padding: 2px 9px; border-radius: 10px;
    }

    .tag-pending  { background: #fff7ed; color: #c2410c; }
    .tag-printed  { background: #f0fdf4; color: #15803d; }
    .tag-info     { background: #f1f5f9; color: #475569; }
    .tag-time     { background: #f8fafc; color: #94a3b8; font-weight: 500; }

    .job-actions { display: flex; gap: 8px; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; }

    .btn {
      padding: 8px 14px; border-radius: 8px;
      font-size: 13px; font-weight: 600;
      cursor: pointer; border: none; text-decoration: none;
      transition: all 0.15s; display: inline-flex;
      align-items: center; gap: 5px;
    }

    .btn-view  { background: #f1f5f9; color: #334155; border: 1px solid #e2e8f0; }
    .btn-view:hover { background: #e2e8f0; }
    .btn-print { background: #3b82f6; color: #fff; }
    .btn-print:hover { background: #2563eb; }
    .btn-done  { background: #22c55e; color: #fff; }
    .btn-done:hover { background: #16a34a; }
    .btn-del   { background: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; }
    .btn-del:hover { background: #fecaca; }

    .empty {
      text-align: center; padding: 60px 20px;
      background: #fff; border-radius: 14px; color: #94a3b8;
    }

    .empty div { font-size: 42px; margin-bottom: 12px; }
    .empty p { font-size: 15px; }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <h2>🖨️ Print Dashboard</h2>
    <p>Auto-refreshes every 5 seconds</p>
  </div>
  <span class="count-badge" id="count">Loading...</span>
</header>

<div class="filters">
  <button class="filter-btn active" id="filter-all"     onclick="setFilter('all')">All</button>
  <button class="filter-btn"        id="filter-pending" onclick="setFilter('pending')">⏳ Pending</button>
  <button class="filter-btn"        id="filter-printed" onclick="setFilter('printed')">✅ Printed</button>
  <button class="filter-btn"        id="filter-bw"      onclick="setFilter('bw')">B&amp;W</button>
  <button class="filter-btn"        id="filter-color"   onclick="setFilter('color')">Color</button>
</div>

<div class="select-bar">
  <div class="select-bar-left">
    <label class="select-all-label">
      <input type="checkbox" id="selectAll" onchange="toggleSelectAll()" />
      Select All
    </label>
    <span class="selected-info" id="selectedInfo"></span>
  </div>
  <button class="btn-delete-selected" id="btnDeleteSelected" onclick="deleteSelected()">
    🗑️ Delete Selected
  </button>
</div>

<div id="jobs"><p style="text-align:center;padding:40px;color:#94a3b8;">Loading jobs...</p></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://hommwwdjqzkcoxheerxl.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhvbW13d2RqcXprY294aGVlcnhsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0NzQ4NTIsImV4cCI6MjA5NjA1MDg1Mn0.ZGp5GZpkcDrjyywfSBQjk2PmIKbJwtDKUs4ruAlNTNY";

const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let currentFilter = "all";
let autoRefreshTimer = null;

function formatTime(d) {
  const date = new Date(d);
  const now = new Date();
  const mins = Math.floor((now - date) / 60000);
  let ago = mins < 1 ? "just now" : mins < 60 ? mins + "m ago" : mins < 1440 ? Math.floor(mins/60) + "h ago" : Math.floor(mins/1440) + "d ago";
  const timeStr = date.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  const dateStr = date.toLocaleDateString([], { day: "numeric", month: "short" });
  return (now.toDateString() === date.toDateString() ? timeStr : dateStr + " " + timeStr) + " · " + ago;
}

function setFilter(type) {
  currentFilter = type;
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
  document.getElementById("filter-" + type).classList.add("active");
  document.getElementById("selectAll").checked = false;
  loadJobs();
}

function onCheckboxChange() {
  const allBoxes = document.querySelectorAll(".job-checkbox-input");
  const checkedBoxes = document.querySelectorAll(".job-checkbox-input:checked");
  const count = checkedBoxes.length;

  document.getElementById("selectAll").checked = allBoxes.length > 0 && count === allBoxes.length;
  document.getElementById("selectAll").indeterminate = count > 0 && count < allBoxes.length;

  const info = document.getElementById("selectedInfo");
  info.innerText = count > 0 ? count + " selected" : "";

  const delBtn = document.getElementById("btnDeleteSelected");
  if (count > 0) delBtn.classList.add("visible");
  else delBtn.classList.remove("visible");

  document.querySelectorAll(".job").forEach(card => {
    const cb = card.querySelector(".job-checkbox-input");
    if (cb && cb.checked) card.classList.add("is-selected");
    else card.classList.remove("is-selected");
  });
}

function toggleSelectAll() {
  const checked = document.getElementById("selectAll").checked;
  document.querySelectorAll(".job-checkbox-input").forEach(cb => cb.checked = checked);
  onCheckboxChange();
}

async function markDone(id) {
  const { error } = await client.from("print_jobs").update({ status: "printed" }).eq("id", id);
  if (error) { alert("Error: " + error.message); return; }
  loadJobs();
}

async function deleteSingle(id) {
  if (!confirm("Delete this job?")) return;
  const { error } = await client.from("print_jobs").delete().eq("id", id);
  if (error) { alert("Delete failed: " + error.message); return; }
  loadJobs();
}

async function deleteSelected() {
  const checked = document.querySelectorAll(".job-checkbox-input:checked");
  if (checked.length === 0) return;
  if (!confirm("Delete " + checked.length + " selected job(s)? This cannot be undone.")) return;

  const ids = Array.from(checked).map(cb => cb.dataset.id);
  const { error } = await client.from("print_jobs").delete().in("id", ids);
  if (error) { alert("Delete failed: " + error.message); return; }

  document.getElementById("selectAll").checked = false;
  document.getElementById("selectedInfo").innerText = "";
  document.getElementById("btnDeleteSelected").classList.remove("visible");
  loadJobs();
}

function printJob(url) {
  const win = window.open(url);
  if (!win) { alert("Please allow popups to print."); return; }
  win.onload = () => setTimeout(() => win.print(), 600);
}

async function loadJobs() {
  let q = client.from("print_jobs").select("*").order("created_at", { ascending: false });
  if (currentFilter === "pending") q = q.eq("status", "pending");
  if (currentFilter === "printed") q = q.eq("status", "printed");
  if (currentFilter === "bw")      q = q.eq("print_type", "bw");
  if (currentFilter === "color")   q = q.eq("print_type", "color");

  const { data, error } = await q;
  const container = document.getElementById("jobs");

  if (error) {
    container.innerHTML = '<div class="empty"><div>⚠️</div><p>' + error.message + '</p></div>';
    return;
  }

  document.getElementById("count").innerText = (data ? data.length : 0) + " job(s)";

  if (!data || data.length === 0) {
    container.innerHTML = '<div class="empty"><div>📭</div><p>No jobs found.</p></div>';
    return;
  }

  container.innerHTML = data.map(job => {
    const done = job.status === "printed";
    const type = job.print_type === "color" ? "Color" : "B&W";
    const customer = job.customer_name || "Unknown";

    return '<div class="job ' + (done ? "is-printed" : "is-pending") + '" id="job-' + job.id + '">' +
      '<div class="job-checkbox">' +
        '<input type="checkbox" class="job-checkbox-input" data-id="' + job.id + '" onchange="onCheckboxChange()" />' +
      '</div>' +
      '<div class="job-left">' +
        '<div class="job-icon">' + (done ? "✅" : "📄") + '</div>' +
        '<div class="job-details">' +
          '<div class="job-customer">👤 ' + customer + '</div>' +
          '<div class="job-filename">📎 ' + job.file_name + '</div>' +
          '<div class="job-tags">' +
            '<span class="tag ' + (done ? "tag-printed" : "tag-pending") + '">' + (done ? "✅ Printed" : "⏳ Pending") + '</span>' +
            (job.pages    ? '<span class="tag tag-info">' + job.pages + ' pages</span>' : '') +
            '<span class="tag tag-info">' + type + '</span>' +
            (job.price    ? '<span class="tag tag-info">Rs.' + job.price + '</span>' : '') +
            (job.created_at ? '<span class="tag tag-time">' + formatTime(job.created_at) + '</span>' : '') +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="job-actions">' +
        '<a class="btn btn-view" href="' + job.file_url + '" target="_blank">View</a>' +
        '<button class="btn btn-print" onclick="printJob(\'' + job.file_url + '\')">🖨️ Print</button>' +
        (!done ? '<button class="btn btn-done" onclick="markDone(\'' + job.id + '\')">✔ Done</button>' : '') +
        '<button class="btn btn-del" onclick="deleteSingle(\'' + job.id + '\')">🗑️</button>' +
      '</div>' +
    '</div>';
  }).join("");

  onCheckboxChange();
}

loadJobs();
setInterval(loadJobs, 5000);
</script>

</body>
</html>
